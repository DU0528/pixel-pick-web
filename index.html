<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel Pick</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1 class="logo">Pixel Pick</h1>
    <p class="subtitle">화면의 어느 곳이든 색상을 추출하세요</p>

    <div id="unsupported-banner" class="banner hidden">
      이 기능은 <strong>Chrome 또는 Edge</strong>에서만 지원됩니다.
    </div>

    <div class="card">
      <div id="swatch" class="swatch empty" aria-label="추출된 색상"></div>

      <div class="formats" id="formats">
        <div class="format-row">
          <span class="format-label">HEX</span>
          <span class="format-value" id="hex-value">—</span>
          <button class="copy-btn" id="copy-hex" disabled>Copy</button>
        </div>
        <div class="format-row">
          <span class="format-label">RGB</span>
          <span class="format-value" id="rgb-value">—</span>
          <button class="copy-btn" id="copy-rgb" disabled>Copy</button>
        </div>
        <div class="format-row">
          <span class="format-label">HSL</span>
          <span class="format-value" id="hsl-value">—</span>
          <button class="copy-btn" id="copy-hsl" disabled>Copy</button>
        </div>
      </div>

      <button class="pick-btn" id="pick-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 2a5 5 0 0 1 5 5c0 2-1 3.5-2.5 5L9 17.5l-1 1-2 .5.5-2 1-1L12 11C10.5 9.5 9.5 8 9.5 6A5 5 0 0 1 12 2z"/>
          <line x1="3" y1="21" x2="9" y2="15"/>
        </svg>
        스포이드로 추출
      </button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
